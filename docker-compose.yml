version: '3.8'

services:
  db:
    image: postgres:15
    container_name: venom_db
    environment:
      POSTGRES_USER: venom_user
      POSTGRES_PASSWORD: venom_pass
      POSTGRES_DB: venom_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venom_user -d venom_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./venom-backend
    container_name: venom_backend
    environment:
      DATABASE_URL: postgresql://venom_user:venom_pass@db:5432/venom_db
      GROQ_API_KEY: ${GROQ_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./venom-backend:/app
      - venom_knowledge:/app/venom_knowledge
    restart: unless-stopped

  frontend:
    build: ./venom-frontend
    container_name: venom_frontend
    ports:
      - "5173:5173"  
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000  

volumes:
  postgres_data:
  venom_knowledge: