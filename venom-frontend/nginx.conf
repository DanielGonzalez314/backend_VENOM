server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Opcional: que el frontend también sirva como proxy de API (no necesario si el frontend y backend están en contenedores separados y se comunican directamente)
     location /api/ {
         proxy_pass http://backend:8000/api/;
         proxy_set_header Host $host;
     }
}